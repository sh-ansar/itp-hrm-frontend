name: HRM Connected PostgreSQL Gateway E2E

on:
  pull_request:
  push:
    branches: [main]

# Purely disposable runner services. NEVER target any existing platform/ETP/Spyon database.
jobs:
  postgres16-laravel-minio-chromium:
    # Playwright 1.56.1 supports 24.04; ubuntu-latest has moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itp_hrm_browser_ci
          POSTGRES_USER: hrm_browser_ci
          POSTGRES_PASSWORD: synthetic_ci_pg_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm_browser_ci -d itp_hrm_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GITHUB_ACTIONS: 'true'
      HRM_DISPOSABLE_BROWSER_POSTGRES: isolated-pg16
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: itp_hrm_browser_ci
      DB_SCHEMA: hrm
      DB_USERNAME: hrm_browser_ci
      DB_PASSWORD: synthetic_ci_pg_only
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_COOKIE: hrm_ci_browser_session
      SESSION_PATH: /
      SESSION_SECURE_COOKIE: 'false'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: lax
      QUEUE_CONNECTION: sync
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,localhost:5173
      HRM_BROWSER_LOGIN_ENABLED: 'true'
      HRM_PASSWORD_RESET_ENABLED: 'true'
      HRM_ROLE_MANAGEMENT_ENABLED: 'true'
      HRM_PERSONNEL_WRITES_ENABLED: 'true'
      HRM_DOCUMENT_WRITES_ENABLED: 'true'
      HRM_ORDER_APPROVALS_ENABLED: 'true'
      HRM_WORKTIME_WRITES_ENABLED: 'true'
      HRM_LEAVE_WRITES_ENABLED: 'true'
      HRM_BONUS_WRITES_ENABLED: 'true'
      HRM_PROTECTED_LEAVE_EVIDENCE_ENABLED: 'true'
      HRM_PROTECTED_LEAVE_EVIDENCE_REQUIRED: 'true'
      HRM_LEAVE_BALANCE_WRITES_ENABLED: 'true'
      HRM_LEAVE_BALANCE_ENFORCEMENT_ENABLED: 'false'
      HRM_XSRF_COOKIE_NAME: HRM-XSRF-TOKEN
      HRM_FRONTEND_URL: http://127.0.0.1:5173/
      MAIL_MAILER: log
      VITE_DEMO_MODE: 'false'
      VITE_ENABLE_BROWSER_LOGIN: 'true'
      VITE_APP_BASE_PATH: /
      VITE_BACKEND_PREFIX: /hrm-api
      VITE_API_BASE_URL: /hrm-api/api/v1
      VITE_XSRF_COOKIE_NAME: HRM-XSRF-TOKEN
      HRM_E2E_API_PREFIX: /hrm-api
      HRM_E2E_XSRF_COOKIE_NAME: HRM-XSRF-TOKEN
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: hrm-ci-postgres-browser
      MINIO_ACCESS_KEY: hrm-postgres-ci
      MINIO_SECRET_KEY: Synthetic-Isolated-MinIO-CI-2026
    steps:
      - name: Checkout reviewed frontend
        uses: actions/checkout@v4
      - name: Checkout exact reviewed Laravel backend
        uses: actions/checkout@v4
        with:
          repository: sh-ansar/itp-hrm-backend
          ref: 764878faa1b6390249f68d6dc08b2685d9672e4b
          path: backend
          persist-credentials: false
      - name: Set up PHP 8.4 with native PostgreSQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, gd, mbstring, pdo_pgsql, pgsql, fileinfo
          coverage: none
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install isolated Laravel and UI dependencies
        run: |
          set -euo pipefail
          (cd backend && composer install --prefer-dist --no-interaction --no-progress)
          npm ci --no-audit --no-fund
      - name: Verify Vue API requests against reviewed Laravel routes
        run: node --test tests/frontend-laravel-route-parity.test.mjs
      - name: Refuse any database other than disposable PostgreSQL
        run: |
          set -euo pipefail
          php tests/e2e/verify-disposable-ci-db.php
          php tests/e2e/create-ci-schema.php
          php backend/artisan migrate --force
      - name: Set up pinned official MinIO source
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Boot a disposable private MinIO instance
        run: |
          set -euo pipefail
          GOMAXPROCS=2 go install -p 2 github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          mkdir -p "$RUNNER_TEMP/hrm-postgres-minio"
          MINIO_ROOT_USER="$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$HOME/go/bin/minio" server "$RUNNER_TEMP/hrm-postgres-minio" \
              --address 127.0.0.1:9000 > "$RUNNER_TEMP/hrm-postgres-minio.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null; then
              php tests/e2e/prepare-minio.php
              exit 0
            fi
            sleep 1
          done
          tail -n 30 "$RUNNER_TEMP/hrm-postgres-minio.log"
          exit 1
      - name: Install pinned Chromium browser runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hrm-browser-runtime"
          npm install --prefix "$RUNNER_TEMP/hrm-browser-runtime" --no-save --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/hrm-browser-runtime/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/hrm-browser-runtime/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/hrm-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start real Laravel and Vue on loopback only
        run: |
          set -euo pipefail
          (cd backend && php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/laravel.log" 2>&1 &)
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/vue.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null \
              && curl -sf http://127.0.0.1:5173/hrm-api/api/v1/health > /dev/null \
              && curl -sf http://127.0.0.1:5173/login > /dev/null; then
              echo "Connected Vue -> /hrm-api -> Laravel -> PostgreSQL ready"
              exit 0
            fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/laravel.log" "$RUNNER_TEMP/vue.log"
          exit 1
      - name: Chromium connected auth and private document role flows on PostgreSQL
        run: |
          set -euo pipefail
          # Each file receives only synthetic records in this throwaway runner DB.
          # Always check the exact database identity BEFORE migrate:fresh.
          for spec in \
            tests/e2e/connected-postgres-gateway.test.mjs \
            tests/e2e/personnel-order-review.test.mjs \
            tests/e2e/protected-leave-evidence.test.mjs; do
            echo "::group::PostgreSQL browser E2E: $spec"
            php tests/e2e/verify-disposable-ci-db.php
            (cd backend && php artisan migrate:fresh --force > /dev/null)
            php tests/e2e/seed-synthetic-user.php
            php tests/e2e/seed-synthetic-organization.php
            php tests/e2e/seed-bonus-approver.php
            php tests/e2e/seed-role-scenarios.php
            php tests/e2e/inspect-synthetic-organization.php
            node --test --test-concurrency=1 "$spec"
            echo "::endgroup::"
          done
      - name: Safe diagnostics on error
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/laravel.log" || true
          tail -n 100 "$RUNNER_TEMP/vue.log" || true
          tail -n 50 "$RUNNER_TEMP/hrm-postgres-minio.log" || true
