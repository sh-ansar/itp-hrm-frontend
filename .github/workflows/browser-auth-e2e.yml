name: A09 Browser Session E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  chromium-session:
    # Playwright 1.56.1 supports 24.04; ubuntu-latest has moved to unsupported 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [read-only, write-enabled]
    timeout-minutes: 25
    env:
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      SESSION_COOKIE: itp_hrm_e2e_session
      SESSION_SECURE_COOKIE: 'false'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: lax
      QUEUE_CONNECTION: sync
      HRM_BROWSER_LOGIN_ENABLED: 'true'
      HRM_PASSWORD_RESET_ENABLED: 'true'
      HRM_FRONTEND_URL: https://ci.invalid/hrm
      MAIL_MAILER: log
      HRM_ROLE_MANAGEMENT_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_PERSONNEL_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_DOCUMENT_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_ORDER_APPROVALS_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_WORKTIME_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_WORKTIME_PERIOD_APPROVALS_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_BONUS_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_LEAVE_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_PROTECTED_LEAVE_EVIDENCE_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_PROTECTED_LEAVE_EVIDENCE_REQUIRED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_LEAVE_BALANCE_WRITES_ENABLED: ${{ matrix.mode == 'write-enabled' && 'true' || 'false' }}
      HRM_LEAVE_BALANCE_ENFORCEMENT_ENABLED: 'false'
      SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:5173,localhost:5173
      VITE_ENABLE_BROWSER_LOGIN: 'true'
      VITE_API_BASE_URL: /api/v1
      # Synthetic, local-only credentials for an ephemeral CI MinIO instance.
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_REGION: us-east-1
      MINIO_BUCKET: hrm-ci-private-e2e
      MINIO_ACCESS_KEY: hrm-ci-local-user
      MINIO_SECRET_KEY: Synthetic-CI-MinIO-Private-Only-2026
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
      - name: Checkout reviewed Laravel backend at fixed SHA
        uses: actions/checkout@v4
        with:
          repository: sh-ansar/itp-hrm-backend
          ref: 50ddf29b47739508b7eb0dc36a8ff5e6a3f47e36
          path: backend
          persist-credentials: false
      - name: Set up PHP and SQLite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, gd, mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Set up Go for upstream MinIO security-release source
        if: ${{ matrix.mode == 'write-enabled' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false
      - name: Start isolated private MinIO for document upload/download browser test
        if: ${{ matrix.mode == 'write-enabled' }}
        run: |
          set -euo pipefail
          # Upstream images are not available anonymously. Build from the
          # official, fixed upstream Git tag, not an untrusted container mirror.
          GOMAXPROCS=2 go install -p 2 github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          mkdir -p "$RUNNER_TEMP/hrm-minio-data"
          MINIO_ROOT_USER="$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            "$HOME/go/bin/minio" server "$RUNNER_TEMP/hrm-minio-data" \
              --address 127.0.0.1:9000 > "$RUNNER_TEMP/hrm-minio.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live > /dev/null; then
              php tests/e2e/prepare-minio.php
              exit 0
            fi
            sleep 1
          done
          tail -n 40 "$RUNNER_TEMP/hrm-minio.log"
          exit 1
      - name: Install frontend and pinned browser test runtime
        run: |
          npm ci --no-audit --no-fund
          # Keep the pinned browser runtime separate from the Vue app dependency graph.
          mkdir -p "$RUNNER_TEMP/hrm-browser-runtime"
          npm install --prefix "$RUNNER_TEMP/hrm-browser-runtime" --no-save --no-audit --no-fund playwright@1.56.1
          ln -s "$RUNNER_TEMP/hrm-browser-runtime/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/hrm-browser-runtime/node_modules/playwright-core" node_modules/playwright-core
          "$RUNNER_TEMP/hrm-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
      - name: Provision ephemeral DB and synthetic identity
        run: |
          touch backend/database/browser-e2e.sqlite
          echo "DB_DATABASE=$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" >> "$GITHUB_ENV"
          DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php backend/artisan migrate --force
          DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php tests/e2e/seed-synthetic-user.php
          DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php tests/e2e/seed-synthetic-organization.php
          if [ "$HRM_BONUS_WRITES_ENABLED" = "true" ]; then DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php tests/e2e/seed-bonus-approver.php; fi
          DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php tests/e2e/inspect-synthetic-organization.php
      - name: Launch first-party browser application
        run: |
          (
            cd backend
            php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/hrm-backend.log" 2>&1 &
          )
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/hrm-frontend.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/api/v1/health > /dev/null \
              && curl --silent --fail http://127.0.0.1:5173/login > /dev/null; then
              echo "Isolated first-party test services are available"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/hrm-backend.log" "$RUNNER_TEMP/hrm-frontend.log"
          exit 1
      - name: Run Chromium browser integration tests
        run: |
          set -euo pipefail
          if [ "$HRM_PERSONNEL_WRITES_ENABLED" = "true" ]; then
            tests="tests/e2e/protected-leave-evidence.test.mjs tests/e2e/employee-education.test.mjs tests/e2e/employee-private-records.test.mjs tests/e2e/private-profile.test.mjs tests/e2e/profile-edit.test.mjs tests/e2e/assignment-create.test.mjs tests/e2e/employee-master.test.mjs tests/e2e/employee-photo.test.mjs tests/e2e/staffing.test.mjs tests/e2e/department-tree.test.mjs tests/e2e/position-directory.test.mjs tests/e2e/personnel-actions.test.mjs tests/e2e/personnel-actions-locales.test.mjs tests/e2e/bonus-workflow.test.mjs tests/e2e/protected-leave-ui.test.mjs tests/e2e/documents-write.test.mjs tests/e2e/document-tags.test.mjs tests/e2e/personnel-order-review.test.mjs tests/e2e/development-write.test.mjs tests/e2e/timesheet-write.test.mjs tests/e2e/timesheet-period-review.test.mjs tests/e2e/work-schedule-management.test.mjs tests/e2e/reports-connected.test.mjs tests/e2e/settings-preferences.test.mjs tests/e2e/employee-contracts.test.mjs tests/e2e/calendar-bulk.test.mjs tests/e2e/role-user-flows.test.mjs tests/e2e/employee-self-service.test.mjs tests/e2e/employee-personal-documents.test.mjs tests/e2e/leave-balance-ledger.test.mjs tests/e2e/leave-actual-review.test.mjs tests/e2e/action-dropdown-size.test.mjs"
          else
            tests="tests/e2e/company-access.test.mjs tests/e2e/auth.test.mjs tests/e2e/components.test.mjs tests/e2e/organization.test.mjs tests/e2e/documents-readonly.test.mjs tests/e2e/prototype-shell.test.mjs tests/e2e/employee-registry-visual.test.mjs tests/e2e/zip-registry-card.test.mjs tests/e2e/organization-diagram.test.mjs tests/e2e/directory-search.test.mjs tests/e2e/org-staffing-navigation.test.mjs tests/e2e/employee-tabs-scroll.test.mjs tests/e2e/all-routes-responsive.test.mjs tests/e2e/development-readonly.test.mjs"
          fi
          # Every test file must begin from a clean synthetic company/employee state.
          # Otherwise personnel-action tests mutate the shared fixture and make subsequent
          # screens appear broken even though their permissions and queries are correct.
          failed=0
          for test_file in $tests; do
            echo "::group::Isolated browser test: $test_file"
            (cd backend && php artisan migrate:fresh --force > /dev/null)
            php tests/e2e/seed-synthetic-user.php > /dev/null
            php tests/e2e/seed-synthetic-organization.php > /dev/null
            if [ "$HRM_BONUS_WRITES_ENABLED" = "true" ]; then php tests/e2e/seed-bonus-approver.php > /dev/null; fi
            if [ "$test_file" = "tests/e2e/role-user-flows.test.mjs" ] || [ "$test_file" = "tests/e2e/employee-self-service.test.mjs" ] || [ "$test_file" = "tests/e2e/employee-personal-documents.test.mjs" ] || [ "$test_file" = "tests/e2e/protected-leave-evidence.test.mjs" ] || [ "$test_file" = "tests/e2e/personnel-order-review.test.mjs" ]; then php tests/e2e/seed-role-scenarios.php > /dev/null; fi
            if [ "$test_file" = "tests/e2e/timesheet-period-review.test.mjs" ]; then php tests/e2e/seed-timesheet-reviewer.php > /dev/null; fi
            if ! node --test --test-concurrency=1 "$test_file"; then
              echo "::error file=$test_file::Browser test failed"
              failed=1
              # The new privacy-critical upload test runs first: return its
              # diagnostics immediately instead of masking it behind 25+ tests.
              if [ "$test_file" = "tests/e2e/protected-leave-evidence.test.mjs" ]; then
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Print server diagnostics on failure
        if: failure()
        run: |
          DB_DATABASE="$GITHUB_WORKSPACE/backend/database/browser-e2e.sqlite" php tests/e2e/inspect-synthetic-organization.php || true
          tail -n 100 "$RUNNER_TEMP/hrm-backend.log" || true
          tail -n 100 "$RUNNER_TEMP/hrm-frontend.log" || true